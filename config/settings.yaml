# NBA DFS Optimizer settings.
# Every line here has a plain-English comment. Change a number, commit, and the
# next pipeline run uses it. Settings that only affect the phone app (optimizer
# knobs) can also be changed on the phone in the Settings screen.

data:  # Where data comes from
  salary_repo: csorcic/dk_salary  # The private repo that stores the daily DK salary CSV
  salary_folder: salaries  # Folder inside that repo that holds the CSV files
  current_season: 2027  # ESPN season label for 2026-27 (ESPN names a season by the year it ends)
  prior_season: 2026  # ESPN season label for 2025-26, used as a starting point early in the season
  exclude_out_players: true  # Leave players marked OUT by DraftKings out of the player pool
  espn_max_new_games_per_run: 2000  # Most new ESPN box scores downloaded in one run (the first run backfills ~1,400 games)
  odds_regions: us  # Sportsbook region for The Odds API
  odds_markets: spreads,totals  # Betting markets to pull (no player props: those cost money)

projections:  # How each player's fantasy-point projection is built
  recency_half_life_games: 10  # How fast old games fade: a game this many games ago counts half as much as the latest one
  use_prior_season: true  # Blend in last season's scoring rate early in the season (true or false)
  prior_season_k: 10  # Blend strength: this season counts games/(games + this number); bigger = trust last season longer
  prior_season_minutes_k: 3  # Same blend for minutes; smaller because roles show up faster than scoring rates
  minutes_lookback_games: 10  # Number of recent games used to estimate a player's minutes
  rotation_minutes: 18  # Players averaging fewer minutes than this sometimes sit; their minutes are scaled by how often they've played lately
  max_minutes: 40  # Nobody is projected for more minutes than this, even with a minutes bump
  bump_minutes_power: 0.0  # How a missing player's minutes are shared: 1 = in proportion to each teammate's minutes, 0 = evenly, 0.5 = in between
  bump_same_position_weight: 1.0  # When a player is OUT, teammates at his position get this much extra share of his minutes (1.0 = double share)
  starter_minutes_threshold: 28  # Players projected for at least this many minutes count as starters for blowout risk
  blowout_spread_threshold: 10  # Point spread at which starters start losing minutes to blowout risk
  blowout_minutes_cut_per_point: 0.01  # Share of starter minutes removed per spread point beyond the threshold (0.01 = 1%)
  blowout_max_minutes_cut: 0.12  # Most starter minutes ever removed for blowout risk (0.12 = 12%)
  team_points_prior_k: 5  # Blend for each team's normal scoring: this season counts games/(games + this number)
  vegas_exponent: 1.0  # How strongly Vegas team totals move projections (0 = ignore Vegas, 1 = proportional)
  sd_lookback_games: 40  # Number of recent games used to measure a player's boom/bust spread
  sd_prior_games: 8  # How many games of evidence before we trust a player's own boom/bust spread over his position's average
  sd_scale: 1.15  # Widens (above 1) or narrows (below 1) every player's boom/bust range
  ceiling_z: 1.28  # Ceiling = projection + this many standard deviations (1.28 is about the 90th percentile)
  floor_z: 1.28  # Floor = projection - this many standard deviations (1.28 is about the 10th percentile)
  ownership_total_pct: 800  # Estimated ownership across all players adds up to this (8 roster spots x 100%)

ownership:  # Estimated ownership: a simple guess at how popular each player will be (no paid data)
  intercept: -3.0  # Starting point for every player; lower = ownership more concentrated on the top plays
  value_weight: 1.1  # How much points per $1K drives popularity (the biggest factor)
  projection_weight: 0.5  # How much a big projection draws users
  rank_weight: -0.35  # Extra attention for the very top projections (negative: ranks further down get less)
  bump_weight: 0.06  # Extra popularity per minute of minutes bump (injury news creates chalk)
  team_total_weight: 0.25  # Extra popularity for players on teams Vegas expects to score a lot
  salary_weight: 0.0  # Extra (+) or less (-) popularity for expensive players at the same value
  max_pct: 75  # Nobody is estimated above this percent owned

optimizer:  # Starting values for the lineup builder (each can be changed in the app)
  salary_cap: 50000  # DraftKings Classic salary cap in dollars
  cash_lineups: 1  # Number of lineups to build in Cash mode
  cash_max_lineups: 20  # Most lineups Cash mode will build
  cash_min_unique: 1  # Each Cash lineup must differ from every earlier one by at least this many players
  cash_floor_weight: 0.0  # In Cash mode, extra credit for a player's floor (0 = ignore floor)
  gpp_lineups: 20  # Number of lineups to build in Tournament (GPP) mode (1 to 150)
  gpp_min_unique: 3  # Each new GPP lineup must differ from every earlier one by at least this many players
  gpp_max_exposure_pct: 50  # No player can be in more than this percent of GPP lineups
  gpp_randomness: 1.0  # How much projections are shuffled between GPP lineups (0 = none, 1 = normal)
  gpp_ceiling_weight: 0.3  # In GPP mode, how much a player's ceiling counts on top of his projection
  gpp_ownership_penalty: 0.1  # In GPP mode, points subtracted per 1% of estimated ownership (fades chalk)
  stack_min_players: 0  # Require at least this many players from one game (0 = off)
  stack_top_games: 3  # Stacks may only come from this many highest-total games
  stack_bring_back: false  # When stacking, also require a player from the other team in that game

backtest:  # How scripts/backtest.py groups its report
  salary_tiers: [4000, 6000, 8000]  # Salary breakpoints for the report (under $4K, $4-6K, $6-8K, $8K+)
  projection_tiers: [15, 25, 35]  # Projection breakpoints used when a day has no DK salary file

review:  # Slate review: after each slate, the best lineup in hindsight and how our projections did
  hindsight_top_n: 50  # How many of the best possible lineups (using actual points) to study each night
  hindsight_min_unique: 1  # Each of those lineups differs from every better one by at least this many players
  smash_multiplier: 6  # A "smash" is a player who scored at least this many points per $1K of salary (6x)
  star_salary: 9000  # Players at or above this salary count as "stars" in lineup make-up
  value_salary: 4500  # Players below this salary count as "value plays" in lineup make-up
  projection_miss_margin: 5  # An optimal player who beat our ceiling by more than this many points is a "projection miss"
  settings_miss_value_rank: 20  # An optimal player we projected fairly but ranked worse than this in points per $1K is a "settings miss"
  fallback_sd_pct: 0.30  # When projections are rebuilt and a player has no history, his boom/bust spread is this share of his projection
  postponed_after_days: 2  # A game still missing its box score this many days later is treated as postponed, and the slate is reviewed without it
  dk_username: csorcic  # Your DraftKings username, used to find your own entries in contest standings files
  contest_slate_min_match_pct: 90  # A standings file belongs to a slate only if at least this % of its players are on that slate's salary file
  contest_fpts_tolerance: 0.5  # When two slates both fit, a player's DK points must be within this many points of our box score to count as agreeing
  contest_cash_line_pct: 50  # Approximate cash line: the score that beat this % of the field (50 = double-up style; GPPs pay about the top 20%)
  contest_max_winning_lineups: 5  # Most tied first-place lineups to keep per contest
  contest_min_readable_lineups_pct: 95  # Real ownership is counted from the lineups when at least this % of them can be read; otherwise DK's %Drafted column is used
