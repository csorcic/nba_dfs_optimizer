<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="description" content="DraftKings NBA Classic lineup builder">
  <title>DFS Lineups</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <link rel="stylesheet" href="app/styles.css?v=fe02334457">
</head>
<body>
  <header class="topbar">
    <h1 id="title">DFS Lineups</h1>

    <a href="#slate" data-view="slate"><span class="ico" aria-hidden="true">◷</span>Slate</a>

    <a href="#review" data-view="review"><span class="ico" aria-hidden="true">✓</span>Review</a>
    <a href="#settings" data-view="settings"><span class="ico" aria-hidden="true">⋯</span>Settings</a>
  </nav>
  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app/app.js?v=fe02334457"></script>

</html>
