name: Pipeline

# Pulls salaries, ESPN box scores and betting lines, then builds the player table.
# 14:15 UTC is about 8:15 AM Central (after the salary file lands at 13:47 UTC);
# 18:30 UTC is about 12:30 PM Central (backup, since GitHub often starts scheduled runs late);
# 22:00 UTC is about 4 PM Central (picks up line moves). Each run uses 1 Odds API request.
on:
  schedule:
    - cron: "15 14 * * *"
    - cron: "30 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Start from the latest main (a re-run would otherwise use an older copy)
        run: git fetch -q origin main && git reset -q --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python -m pytest -q
      - name: Run pipeline
        env:
          DK_SALARY_TOKEN: ${{ secrets.DK_SALARY_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run
      - name: Backtest projections (current season)
        run: python scripts/backtest.py
      - name: Review finished slates (hindsight-optimal lineups)
        run: python -m pipeline.review
      - name: Import DK contest standings (never fails the run)
        continue-on-error: true
        run: python -m pipeline.contests
      - name: Lessons across all slates (recommendations only)
        run: python scripts/lessons.py
      - name: Save data back to the repo
        if: always()  # keep downloaded box scores even if a later step failed
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "Pipeline data $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another run saved the same data files meanwhile, this run's newer files win.
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
