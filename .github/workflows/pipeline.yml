name: Pipeline

# Pulls salaries, ESPN box scores and betting lines, then builds the player table.
# 14:15 UTC is about 8:15 AM Central (after the salary file lands at 13:47 UTC);
# 22:00 UTC is about 4 PM Central (picks up line moves).
on:
  schedule:
    - cron: "15 14 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run pipeline
        env:
          DK_SALARY_TOKEN: ${{ secrets.DK_SALARY_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run
      - name: Backtest projections (current season)
        run: python scripts/backtest.py
      - name: Save data back to the repo
        if: always()  # keep downloaded box scores even if a later step failed
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "Pipeline data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
